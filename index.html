const shuffle = list => { const a=[...list]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const $=id=>document.getElementById(id);
let topic=2, mixed=false, questions=[], answers=[], at=0, seed=[];
const all=()=>Object.entries(BANK).flatMap(([t,qs])=>qs.map((q,i)=>({...q,topic:Number(t),id:`${t}-${i}`})));
const pool=()=>all().filter(q=>mixed||q.topic===topic);
function start(items=pool()){
 seed=items;questions=shuffle(items).map(q=>({...q,options:shuffle(q.options)}));answers=Array(questions.length).fill(null);at=0;
 $('finish').classList.add('hidden');$('quiz').classList.remove('hidden');render();
}
function counts(){return {done:answers.filter(a=>a!==null).length,right:answers.filter((a,i)=>a!==null&&questions[i].options[a].correct).length};}
function render(focus=false){
 const q=questions[at],chosen=answers[at], answered=chosen!==null,c=counts();
 $('position').textContent=`${mixed?'Tema '+q.topic+' · ':''}Pregunta ${at+1} de ${questions.length}`;
 $('tally').textContent=`${c.right} aciertos · ${c.done} respondidas`;
 $('progress').max=questions.length;$('progress').value=c.done;
 $('question').textContent=q.q;$('options').replaceChildren();
 q.options.forEach((o,i)=>{
 const b=document.createElement('button');b.className='option';b.type='button';b.disabled=answered;
 const letter=document.createElement('span');letter.className='letter';letter.textContent='ABCD'[i];letter.setAttribute('aria-hidden','true');b.append(letter);
 const body=document.createElement('span');
 if(answered){
   if(o.correct)b.classList.add('correct');else if(i===chosen)b.classList.add('wrong');
   const label=document.createElement('span');label.className='status';label.textContent=(o.correct?'Correcta':'Incorrecta')+(i===chosen?' · Tu respuesta':'');body.append(label);
 }
 const text=document.createElement('span');text.textContent=o.text;body.append(text);
 if(answered){const why=document.createElement('span');why.className='explain';why.textContent=o.why;body.append(why);}
 b.append(body);b.addEventListener('click',()=>{if(answers[at]!==null)return;answers[at]=i;render();});$('options').append(b);
 });
 $('feedback').textContent=answered?(q.options[chosen].correct?'Respuesta acertada.':'Respuesta incorrecta. La opción correcta aparece en verde.') : '';
 $('prev').disabled=at===0;$('next').disabled=!answered;
 $('next').textContent=at===questions.length-1?(c.done===questions.length?'Ver resultado':'Ir a la pendiente'):'Siguiente';
 if(focus)$('question').focus();
}
function finish(){const c=counts();$('quiz').classList.add('hidden');$('finish').classList.remove('hidden');$('score').textContent=`${c.right} / ${questions.length}`;$('summary').textContent=`${Math.round(100*c.right/questions.length)} % de aciertos`;$('errors').hidden=c.right===questions.length;$('finishTitle').focus();}
$('next').addEventListener('click',()=>{if(answers[at]===null)return;if(at<questions.length-1){at++;render(true);}else if(answers.includes(null)){at=answers.indexOf(null);render(true);}else finish();});
$('prev').addEventListener('click',()=>{if(at>0){at--;render(true);}});
$('restart').addEventListener('click',()=>start(seed));
$('again').addEventListener('click',()=>start(seed));
$('errors').addEventListener('click',()=>start(questions.filter((q,i)=>answers[i]!==null&&!q.options[answers[i]].correct)));
$('review').addEventListener('click',()=>{$('finish').classList.add('hidden');$('quiz').classList.remove('hidden');at=0;render(true);});
document.querySelectorAll('[data-topic]').forEach(b=>b.addEventListener('click',()=>{topic=Number(b.dataset.topic);mixed=false;$('mode').value='topic';document.querySelectorAll('[data-topic]').forEach(x=>x.setAttribute('aria-pressed',String(Number(x.dataset.topic)===topic)));start();}));
